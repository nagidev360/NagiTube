<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NagiTube — Sign in</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0f1115;color:#f5f5f5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,430px);padding:32px;border:1px solid #292d35;border-radius:24px;background:#191c22}
.brand{font-size:30px;font-weight:800;letter-spacing:-1px}.brand span{color:#ff1744}
p{color:#aeb4c0;line-height:1.5}button{width:100%;padding:13px 16px;border:0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
#signin{background:white;color:#161616}#signout{background:#303540;color:white;display:none}
#status{font-size:13px;overflow-wrap:anywhere}
</style>
</head>
<body><main><div class="brand">Nagi<span>Tube</span></div><h1>Watch what you love.</h1>
<p>Sign in with Google to connect your NagiTube account.</p>
<button id="signin">Continue with Google</button><button id="signout">Sign out</button><p id="status">Configure the Supabase project URL and public anon key to enable sign-in.</p>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const status = document.querySelector('#status');
const signIn = document.querySelector('#signin');
const signOut = document.querySelector('#signout');
let supabase;
if (SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY') {
  supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data } = await supabase.auth.getSession();
  update(data.session);
  supabase.auth.onAuthStateChange((_event, session) => update(session));
}
function update(session) {
  signIn.style.display = session ? 'none' : 'block';
  signOut.style.display = session ? 'block' : 'none';
  status.textContent = session ? 'Signed in as ' + (session.user.email || 'Google user') :
    'Not signed in. Your session is handled by Supabase Auth.';
}
signIn.addEventListener('click', async () => {
  if (!supabase) { status.textContent = 'Set SUPABASE_URL and SUPABASE_ANON_KEY in web/index.html first.'; return; }
  const { error } = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin } });
  if (error) status.textContent = error.message;
});
signOut.addEventListener('click', async () => { const { error } = await supabase.auth.signOut(); status.textContent = error?.message || 'Signed out.'; });
</script></body></html>
